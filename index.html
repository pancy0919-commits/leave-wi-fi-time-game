<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Wi-Fi Time Game - 密室逃脫大挑戰</title>

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;

            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);

            width: 100%;

            justify-content: space-between;

        }
        .notebook-btn {
            background-color: #e43f5a;

            color: #fff;
            padding: 4px 8px;

            cursor: pointer;
            font-size: 12px;
        }
        .notebook-btn:hover {
            background-color: #b33045;
        }
        .room-view {
            flex: 1;
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

            height: 220px;
            background-color: #e43f5a;
            border: 5px solid #b33045;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
            position: relative;
        }
        .door::after {
            content: '●';
            position: absolute;
            right: 12px;
            top: 100px;
            color: #ffd700;
            font-size: 18px;
