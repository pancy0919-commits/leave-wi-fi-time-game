<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Wi-Fi Time Game - 雲端聯機版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- 🚪 主選單介面 -->
        <div class="menu-view" id="menuView">
            <h1 style="color: #00d2d3; margin-bottom: 5px; font-size: 24px; letter-spacing: 1px;">Leave Wi-Fi Time</h1>
            <p style="font-size: 12px; color: #a0aec0; margin-bottom: 25px;">Version 5.0 - 雲端即時聯機排行版</p>
            
            <div class="menu-buttons">
                <button class="menu-btn" onclick="startSingleGame()">👤 單人模式挑戰</button>
                <button class="menu-btn" onclick="createRoomMenu()">🏠 創建聯機房間</button>
                <button class="menu-btn" onclick="joinRoomMenu()">🔑 加入他人房間</button>
            </div>

            <!-- 聯機互動面板 -->
            <div id="mpPanel" class="mp-panel" style="display: none; margin-top: 15px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 6px; width: 80%; box-sizing: border-box;"></div>
        </div>

        <!-- ⏳ 多人聯機等候室介面 (新擴充：當成功連線時會顯示這裡) -->
        <div class="menu-view" id="lobbyView" style="display: none;">
            <h2 style="color: #ffd700; margin-bottom: 5px;">🎮 聯機等候室</h2>
            <p id="lobbyStatus" style="font-size: 14px; color: #cbd5e0; margin-bottom: 20px;">正在等待隊友...</p>
            <div id="playerList" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 6px; width: 80%; text-align: left; margin-bottom: 20px; font-size: 14px;">
                <!-- JavaScript 會動態在此填入玩家狀態 -->
            </div>
            <button class="menu-btn" id="hostStartBtn" onclick="hostLaunchGame()" style="display: none; background-color: #2ed573;">🚀 全員到齊，啟動遊戲</button>
            <p id="clientWaitText" style="display: none; color: #00d2d3; font-size: 13px; animation: pulse 1.5s infinite;">等待房主啟動遊戲中...</p>
        </div>

        <!-- 🦖 遊戲房間視窗 -->
        <div class="game-view-container" id="gameViewContainer" style="display: none;">
            <div class="header">
                <span id="roomTitle">第 1 關：尋找密碼紙條</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="notebook-btn" onclick="toggleNotebook(true)">線索筆記本</button>
                    <span id="timer">時間: 0秒</span>
                </div>
            </div>

            <div class="room-view" id="roomView">
                <div class="door" id="mainDoor">門</div>
                <div id="messageBox" class="message-box" style="opacity: 0;">提示訊息</div>
            </div>

            <div class="inventory-bar" id="inventoryBar">
                <span style="font-size: 13px; color: #a0aec0; margin-right: 5px;">道具欄：</span>
                <div class="slot" id="slot0"></div>
                <div class="slot" id="slot1"></div>
            </div>
        </div>
    </div>

    <!-- 紀錄本視窗 -->
    <div id="notebookModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#ffd700; text-align:center;">🕵️ 線索紀錄本</h3>
            <ul id="notebookList" style="padding-left: 20px; font-size: 14px; line-height: 1.6; color: #e2e8f0;">
                <li>尚未收集到任何線索...</li>
            </ul>
            <button onclick="toggleNotebook(false)" style="width:100%; margin-top:10px;">關閉筆記本</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
